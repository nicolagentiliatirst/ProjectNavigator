<header><div><div class="brand">✦ Project Navigator</div><small>PARTNER ROADMAP · PERT · BUDGET & REPORTING</small></div><div class="right"><span class="pill">● Nessun progetto caricato</span><button class="btn small" id="exportTop">↓ Backup JSON</button></div></header>
<div class="layout"><aside id="nav"><button class="navbutton active" data-view="home">▦ &nbsp; Panoramica</button><button class="navbutton" data-view="roadmap">◫ &nbsp; Partner Roadmap</button><button class="navbutton" data-view="catalog">☷ &nbsp; Esplora progetto</button><button class="navbutton" data-view="pert">◉ &nbsp; PERT interattivo</button><button class="navbutton" data-view="budget">€ &nbsp; Budget e costi</button><button class="navbutton" data-view="entries">✎ &nbsp; Rendicontazione</button><button class="navbutton" data-view="settings">⚙ &nbsp; Dati & backup</button><div class="asidefoot">Fonte: OncoAI Part B revised<br>Ottobre 2026 – Marzo 2029<br><br>Versione locale: i dati inseriti restano su questo browser.</div></aside><main id="main"></main></div>
<div id="shade" class="shade"></div><section id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Dettagli elemento"></section>
<script>let DATA={"meta":{"name":"Nuovo progetto","shortName":"Progetto","durationMonths":12,"startDate":"2026-01-01","description":""},"wp":{},"tasks":[],"partners":[],"pert":[],"links":[],"wpLinks":[],"allDeliverables":[],"allMilestones":[]};
const BASE_PROJECT=JSON.parse(JSON.stringify(DATA));
const KEY='Navigator_blank_local_v5';const money=x=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(x)||0);const num=x=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:2}).format(Number(x)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const ix=id=>DATA.tasks.find(x=>x.id===id);const dateAt=m=>{let a=new Date((DATA.meta?.startDate||"2026-10-01")+"T12:00:00");return new Date(a.getFullYear(),a.getMonth()+m-1,1)};const stamp=m=>dateAt(m).toLocaleDateString('it-IT',{month:'short',year:'numeric'});const monthOf=date=>{const d=new Date(date+'T12:00:00'),a=new Date((DATA.meta?.startDate||'2026-10-01')+'T12:00:00');return (d.getFullYear()-a.getFullYear())*12+d.getMonth()-a.getMonth()+1}; let partners=DATA.partners;const partnerName=p=>p.short;
function initial(){return {project:null,tasks:{},notes:{},attachments:{},budgets:{},rates:{},allocations:{},entries:[],manualLinks:[],settings:{partner:'Tutti',period:'annual',granularity:'quarter',category:'all',countries:[]},pertOffsets:{},researchers:[],objectProgress:{},identity:{logo:null,logoName:'',accent:'#075c69'}}}let state;try{state=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{state=initial()}if(state.project&&Array.isArray(state.project.tasks)){DATA=state.project;partners=DATA.partners;}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Spazio locale insufficiente. Esporta un backup ed elimina allegati voluminosi.')}};
let view='home',selectedPartner=state.settings.partner||'Tutti',pertLevel='task',pertScale=1,pertX=0,pertY=0,pertDrag=null,pertCritical=new Set();const $=x=>document.querySelector(x);function setView(v){view=v;document.querySelectorAll('.navbutton').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('.navbutton').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$('#shade').onclick=closeDrawer;function closeDrawer(){$('#shade').classList.remove('show');$('#drawer').classList.remove('show')}function openDrawer(html){$('#drawer').innerHTML='<div class="row"><b>Dettagli</b><button class="xbtn" id="close">✕</button></div>'+html;$('#shade').classList.add('show');$('#drawer').classList.add('show');$('#close').onclick=closeDrawer}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});const mk=(tag,attrs={})=>{let e=document.createElement(tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e};const btn=(s,fn,cls='btn')=>{const b=mk('button',{class:cls});b.textContent=s;b.onclick=fn;return b};
function getPM(p,wp){const partner=partners.find(x=>x.short===p||x.name===p);return partner?partner.pms[Number(wp.replace('WP',''))-1]:0}function linkbtn(id,text){return `<button class="link" data-open="${esc(id)}">${esc(text??id)}</button>`}function bindOpen(root=document){root.querySelectorAll('[data-open]').forEach(e=>e.addEventListener('click',()=>openItem(e.dataset.open)))}function getTaskStatus(t){return state.tasks[t.id]||{status:'Da aggiornare',pct:0}}
function openItem(id){let t=ix(id);if(t){const rec=getTaskStatus(t),notes=state.notes[id]||[],files=state.attachments[id]||[];openDrawer(`<h2>${esc(t.id)} · ${esc(t.title)}</h2><p class="help">${esc(t.wp)} · M${t.from}–M${t.to} (${stamp(t.from)} – ${stamp(t.to)})</p><p>${esc(t.description)}</p><div class="panel"><b>Responsabilità</b><p class="help">Leader: ${esc(t.lead)}<br>Partecipanti: ${esc(t.partners)}</p><div class="fields"><div class="field"><label>Stato</label><select id="taskStatus"><option>Da aggiornare</option><option>Da avviare</option><option>In corso</option><option>In attesa</option><option>Completato</option></select></div><div class="field"><label>Avanzamento (%)</label><input id="taskPct" type="number" min="0" max="100" value="${Number(rec.pct)||0}"></div></div><button id="taskSave" class="btn primary">Salva avanzamento</button></div><h3>Note e aggiornamenti</h3><div class="field"><textarea id="newNote" rows="3" placeholder="Decisioni, attività svolte, criticità…"></textarea></div><button class="btn small" id="addNote">+ Aggiungi nota</button><div id="notesHere">${notes.slice().reverse().map(n=>`<div class="note"><b>${esc(n.date)}</b><div>${esc(n.text)}</div></div>`).join('')}</div><hr class="divider"><h3>Materiali allegati</h3><p class="help">File locali fino a 900 KB ciascuno. Inclusi nel backup JSON; non caricare dati personali o clinici.</p><input type="file" id="fileAdd"><div id="filesHere" class="list">${files.map((f,i)=>`<div class="note"><a href="${f.data}" download="${esc(f.name)}">${esc(f.name)}</a> · <button data-del-file="${i}" class="btn small danger">Elimina</button></div>`).join('')}</div>`);$('#taskStatus').value=rec.status;$('#taskSave').onclick=()=>{let pct=Number($('#taskPct').value);if(!Number.isFinite(pct)||pct<0||pct>100)return alert('Avanzamento da 0 a 100');state.tasks[id]={status:$('#taskStatus').value,pct};save();openItem(id);if(view!=='pert')render()};$('#addNote').onclick=()=>{let text=$('#newNote').value.trim();if(!text)return;state.notes[id]??=[];state.notes[id].push({text,date:new Date().toLocaleString('it-IT')});save();openItem(id)};$('#fileAdd').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>900000)return alert('Dimensione massima: 900 KB. Usa un riferimento esterno per materiali più grandi.');const reader=new FileReader();reader.onload=()=>{state.attachments[id]??=[];state.attachments[id].push({name:f.name,data:reader.result});save();openItem(id)};reader.readAsDataURL(f)};$('#drawer').querySelectorAll('[data-del-file]').forEach(b=>b.onclick=()=>{state.attachments[id].splice(Number(b.dataset.delFile),1);save();openItem(id)});return}
const d=DATA.allDeliverables.find(x=>x.id===id),m=DATA.allMilestones.find(x=>x.id===id),w=DATA.wp[id],p=partners.find(x=>x.short===id);if(d)openDrawer(`<h2>${esc(d.id)} · ${esc(d.name)}</h2><p>${esc(d.description)}</p><p><b>WP:</b> ${esc(d.wp)}<br><b>Responsabile:</b> ${esc(d.lead)}<br><b>Scadenza:</b> M${d.month} · ${stamp(d.month)}<br><b>Accesso:</b> ${esc(d.access)}</p>`);else if(m)openDrawer(`<h2>${esc(m.id)} · ${esc(m.name)}</h2><p><b>WP:</b> ${esc(m.wp)}<br><b>Responsabile:</b> ${esc(m.lead)}<br><b>Termine:</b> M${m.month} (${stamp(m.month)})</p><p>${esc(m.evidence)}</p>`);else if(w)openDrawer(`<h2>${esc(w.id)} · ${esc(w.name)}</h2><p><b>Lead:</b> ${esc(w.lead)}<br><b>Periodo:</b> M${w.from}–M${w.to}</p><h3>Task</h3><div class="list">${DATA.tasks.filter(t=>t.wp===id).map(t=>`<div class="item" data-open="${t.id}"><b>${t.id}</b> ${esc(t.title)}</div>`).join('')}</div>`),bindOpen($('#drawer'));else if(p){selectedPartner=p.short;setView('roadmap')}}
function header(title,subtitle='',extras=''){return `<div class="headrow"><div><h1>${title}</h1><div class="subtitle">${subtitle}</div></div><div class="buttons">${extras}</div></div>`}function render(){document.querySelector('.brand').textContent='✦ '+(DATA.meta?.shortName||'OncoAI')+' · Project Navigator';const main=$('#main');if(view==='home')renderHome(main);if(view==='roadmap')renderRoadmap(main);if(view==='catalog')renderCatalog(main);if(view==='pert')renderPert(main);if(view==='budget')renderBudget(main);if(view==='entries')renderEntries(main);if(view==='settings')renderSettings(main)}

function renderCatalog(root){root.innerHTML=header('Esplora il progetto','WP, task, deliverable, partner e milestone, tutti consultabili')+`<div class="panel"><div class="fields"><div class="field" style="flex:2;min-width:210px"><label>Ricerca libera</label><input id="search" placeholder="Es. T8.2, governance, FHIR, IRST…"></div><div class="field"><label>Categoria</label><select id="cat"><option value="tasks">Task</option><option value="wp">Work Package</option><option value="del">Deliverable</option><option value="partners">Partner</option><option value="ms">Milestone</option></select></div><div class="field"><label>WP</label><select id="wpFilter"><option value="">Tutti</option>${Object.keys(DATA.wp).map(w=>`<option>${w}</option>`).join('')}</select></div></div><div id="results" class="list"></div></div>`;const draw=()=>{let q=$('#search').value.toLowerCase(),wp=$('#wpFilter').value,cat=$('#cat').value;let arr=cat==='tasks'?DATA.tasks:cat==='wp'?Object.values(DATA.wp):cat==='del'?DATA.allDeliverables:cat==='partners'?partners:DATA.allMilestones;arr=arr.filter(x=>(!wp||x.wp===wp||x.id===wp||(cat==='partners'&&x.pms[Number(wp.slice(2))-1]>0))&&JSON.stringify(x).toLowerCase().includes(q));$('#results').innerHTML=arr.length?arr.map(x=>`<button class="item" data-open="${esc(x.id||x.short)}"><b>${esc(x.id||x.short)} · ${esc(x.title||x.name)}</b><small>${esc(x.wp||x.lead||'Partner')} ${x.from?' · M'+x.from+'–M'+x.to:''}${x.month?' · M'+x.month:''}</small></button>`).join(''):'<p class="muted">Nessun risultato con questi filtri.</p>';bindOpen($('#results'))};['search','cat','wpFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',draw));draw()}

function pertModel(){if(pertLevel==='wp'){let nodes=Object.values(DATA.wp).map((x,i)=>({id:x.id,title:x.name,from:x.from,to:x.to,wp:x.id,col:i%3,row:Math.floor(i/3)}));return {nodes,edges:DATA.wpLinks||[['WP2','WP3'],['WP2','WP5'],['WP3','WP5'],['WP4','WP6'],['WP5','WP6'],['WP5','WP8'],['WP6','WP8'],['WP7','WP8'],['WP8','WP9']].map(([from,to])=>({from,to,type:'FS',lag:0,origin:'modelled'}))}}return {nodes:DATA.pert.map(x=>({...x})),edges:DATA.links.slice()}}
function normalizedEdge(e){return {...e,type:['FS','SS','FF','SF'].includes(e.type)?e.type:'FS',lag:Number(e.lag)||0}}
function duration(n){return Math.max(1,Number(n.to)-Number(n.from)+1)}
function edgeWeight(e,from,to){const lag=Number(e.lag)||0;switch(e.type){case 'SS':return lag;case 'FF':return duration(from)-duration(to)+lag;case 'SF':return -duration(to)+lag;default:return duration(from)+lag}}
function criticalAnalysis(nodes,rawEdges){const edges=rawEdges.map(normalizedEdge),by=Object.fromEntries(nodes.map(n=>[n.id,n])),incoming=Object.fromEntries(nodes.map(n=>[n.id,[]])),outgoing=Object.fromEntries(nodes.map(n=>[n.id,[]])),indeg=Object.fromEntries(nodes.map(n=>[n.id,0]));for(const e of edges){if(!by[e.from]||!by[e.to])continue;incoming[e.to].push(e);outgoing[e.from].push(e);indeg[e.to]++}let q=nodes.filter(n=>indeg[n.id]===0).map(n=>n.id),order=[];while(q.length){const id=q.shift();order.push(id);for(const e of outgoing[id])if(--indeg[e.to]===0)q.push(e.to)}if(order.length!==nodes.length)return {error:'Il reticolo contiene una dipendenza ciclica: impossibile calcolare il cammino critico.',slack:{},project:0};const ES={},LS={};for(const id of order){ES[id]=Math.max(0,...incoming[id].map(e=>ES[e.from]+edgeWeight(e,by[e.from],by[id])))}const project=Math.max(0,...nodes.map(n=>ES[n.id]+duration(n)));for(const id of order.slice().reverse()){LS[id]=outgoing[id].length?Math.min(...outgoing[id].map(e=>LS[e.to]-edgeWeight(e,by[id],by[e.to]))):project-duration(by[id])}const slack=Object.fromEntries(nodes.map(n=>[n.id,Math.max(0,Math.round((LS[n.id]-ES[n.id])*100)/100)]));return {slack,project,ES,LS}}
function checkProject(p){if(!p||!p.meta||!p.meta.name||!p.wp||!Array.isArray(p.tasks)||!Array.isArray(p.partners)||!Array.isArray(p.pert)||!Array.isArray(p.links)||!Array.isArray(p.allDeliverables)||!Array.isArray(p.allMilestones))throw Error('Struttura progetto incompleta');const ids=new Set(p.pert.map(x=>x.id));if(ids.size!==p.pert.length)throw Error('ID dei nodi PERT duplicati');for(const n of p.pert)if(!Number.isFinite(+n.from)||!Number.isFinite(+n.to)||+n.to<+n.from)throw Error('Durata non valida: '+n.id);for(const e of p.links){if(!ids.has(e.from)||!ids.has(e.to)||e.from===e.to)throw Error('Collegamento non valido: '+e.from+' → '+e.to);if(!['FS','SS','FF','SF'].includes(e.type||'FS'))throw Error('Tipo non valido: '+e.type);if(!Number.isFinite(Number(e.lag||0)))throw Error('Lag non valido')}let a=criticalAnalysis(p.pert,p.links);if(a.error)throw Error(a.error);if(p.wpLinks){const w=Object.values(p.wp);const wid=new Set(w.map(x=>x.id));for(const e of p.wpLinks){if(!wid.has(e.from)||!wid.has(e.to)||e.from===e.to)throw Error('Collegamento WP non valido');}const b=criticalAnalysis(w,p.wpLinks);if(b.error)throw Error(b.error)}return true}

function pertLayout(nodes){const sorted=[...nodes].sort((a,b)=>a.from-b.from||a.id.localeCompare(b.id));const groups={};sorted.forEach(n=>{let group=pertLevel==='wp'?Math.floor((n.from-1)/10):Math.floor((n.from-1)/5);(groups[group]??=[]).push(n)});const maxRows=Math.max(...Object.values(groups).map(a=>a.length),1);let coords={};Object.keys(groups).sort((a,b)=>a-b).forEach((key,ci)=>groups[key].forEach((n,ri)=>coords[n.id]={x:80+ci*300,y:70+ri*105}));let ncol=Object.keys(groups).length;return {coords,w:Math.max(1050,ncol*300+160),h:Math.max(550,maxRows*105+100)}}
function renderPert(root){const {nodes,edges}=pertModel(),analysis=criticalAnalysis(nodes,edges),critical=nodes.filter(n=>analysis.slack[n.id]===0).map(n=>n.id);pertCritical=new Set(critical);root.innerHTML=header('PERT · esplorazione interattiva','Le dipendenze sono ricostruite per analisi esplorativa, non ufficiali')+`<section class="panel"><div class="row" style="flex-wrap:wrap"><div class="tabbuttons"><button class="btn small" data-level="wp" aria-pressed="${pertLevel==='wp'}">Solo WP</button><button class="btn small" data-level="task" aria-pressed="${pertLevel==='task'}">Task e dipendenze</button></div><div class="buttons"><button class="btn small" id="zoomIn">＋ Zoom</button><button class="btn small" id="zoomOut">－ Zoom</button><button class="btn small" id="fit">Adatta</button><button class="btn small" id="resetPositions">Ripristina nodi</button></div></div><p class="hint">Rotella per zoom • trascina lo sfondo per spostare • trascina un nodo per riposizionarlo • clic sul nodo per i dettagli. Le informazioni si aprono fuori dal grafico, senza sovrapporsi.</p><div id="pertViewport"><svg id="pertSvg" aria-label="Diagramma interattivo delle dipendenze"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#678b9e" stroke-width="1.4"/></marker></defs><g id="pertTransform"></g></svg></div><div class="row" style="margin-top:11px;flex-wrap:wrap"><p class="hint">Bordo rosso: attività con float zero nella rete ipotizzata. La durata totale calcolata è indicativa e non equivale ai 30 mesi del progetto.</p><div class="buttons"><button class="btn small" id="pertReset">Centra vista</button></div></div></section><section class="panel"><h2>Modifica il reticolo PERT</h2><p class="help">Crea, modifica o rimuovi vincoli: FS fine→inizio, SS inizio→inizio, FF fine→fine, SF inizio→fine. Il lag è espresso in mesi (negativo = anticipo). I collegamenti iniziali sono ipotesi di lavoro.</p><div class="fields"><div class="field"><label>Predecessore</label><select id="edgeFrom">${nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.id)} · ${esc(n.title.slice(0,37))}</option>`).join('')}</select></div><div class="field"><label>Successore</label><select id="edgeTo">${nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.id)} · ${esc(n.title.slice(0,37))}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select id="edgeType"><option value="FS">FS · Fine-Inizio</option><option value="SS">SS · Inizio-Inizio</option><option value="FF">FF · Fine-Fine</option><option value="SF">SF · Inizio-Fine</option></select></div><div class="field"><label>Lag (mesi)</label><input id="edgeLag" type="number" step="1" value="0"></div></div><div class="buttons"><button class="btn primary" id="edgeSave">+ Aggiungi collegamento</button><button class="btn" id="editNodeDates">Modifica attività / durata</button></div><div class="tablewrap" style="max-height:240px;overflow:auto;margin-top:12px"><table><thead><tr><th>Predecessore</th><th>Successore</th><th>Vincolo</th><th>Lag</th><th>Origine</th><th>Azioni</th></tr></thead><tbody>${edges.map((e,i)=>`<tr><td>${esc(e.from)}</td><td>${esc(e.to)}</td><td>${esc(e.type||'FS')}</td><td>${Number(e.lag)||0}</td><td>${esc(e.origin||'modello')}</td><td><button class="btn small" data-edit-edge="${i}">Modifica</button> <button class="btn small danger" data-remove-edge="${i}">Rimuovi</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>Dipendenze e margine di flessibilità</h2>${analysis.error?`<div class="warning">${esc(analysis.error)}</div>`:''}<p class="help">Calcolo CPM illustrativo su durate e relazioni modellate: i task possono sovrapporsi nella pianificazione ufficiale, quindi non usare questi float per rendicontazione o decisioni vincolanti.</p><div class="tablewrap"><table><thead><tr><th>Elemento</th><th>Periodo Part B</th><th>Predecessori ipotizzati</th><th>Float logico stimato</th></tr></thead><tbody>${nodes.map(n=>`<tr><td>${linkbtn(n.id,n.id+' · '+n.title.slice(0,37))}</td><td>M${n.from}–M${n.to}</td><td>${edges.filter(e=>e.to===n.id).map(e=>esc(e.from+' '+(e.type||'FS')+(Number(e.lag)?' '+(e.lag>0?'+':'')+e.lag:'')+'m')).join(', ')||'—'}</td><td>${!analysis.error&&analysis.slack[n.id]===0?'<span class="tag red">Critico nella simulazione</span>':num(analysis.slack[n.id])+' mesi logici'}</td></tr>`).join('')}</tbody></table></div></section>`;

function downloadEmptyTemplate(){
  // Clone and strip runtime state before making distributable HTML.
  const clone=document.documentElement.cloneNode(true);
  const main=clone.querySelector('#main');if(main)main.innerHTML='';
  const dr=clone.querySelector('#drawer');if(dr)dr.innerHTML='';
  clone.querySelectorAll('#pertSvg, #pertViewport').forEach(x=>x.remove());
  const scripts=[...clone.querySelectorAll('script')];
  if(!scripts.length)return alert('Sorgente non disponibile per esportare il modello');
  let script=scripts[0].textContent;
  const beg=script.indexOf('let DATA=');const end=script.indexOf(';\nconst BASE_PROJECT=',beg);
  if(beg<0||end<0)return alert('Struttura interna non riconosciuta');
  script=script.slice(0,beg)+'let DATA='+JSON.stringify(blankProjectModel())+script.slice(end);
  // Non includere le descrizioni OncoAI hardcoded nel modello GitHub.
  script=script.replace(/const PARTNER_SUMMARIES = \{[^;]*\};/, 'const PARTNER_SUMMARIES = {};');
  script=script.replace('const KEY=\'OncoAI_v2_local\'', 'const KEY=\'Navigator_blank_local_v5\'');
  script=script.replace(/partner:'IRST'/g, "partner:'Tutti'").replace(/researchPartner:'IRST'/g, "researchPartner:'Tutti'");
  scripts[0].textContent=script;
  clone.querySelector('title').textContent='Project Navigator · Modello vuoto';
  download('Project_Navigator_Vuoto_GitHub.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8');
}
